<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/assets/app-icon.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1a2233" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>SCS Schedule</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="schedule.css" />
  <script src="../auth-session.js"></script>
  <script src="schedule-guard.js"></script>
</head>
<body class="schedule-app">
  <header class="app-header">
    <div class="app-header-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark">SCS</span>
        <span class="brand-sub">Production Schedule</span>
      </a>
      <div class="page-heading">
        <h1 class="page-title">Schedule</h1>
        <p class="page-sub">Click an empty hour to add a block, or drag one into another column</p>
      </div>
      <nav class="header-actions">
        <a href="../menu.html" class="icon-btn" aria-label="Main menu">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
        </a>
      </nav>
    </div>
  </header>

  <div class="sch-page">
    <div class="sch-source" id="sourceStatus" role="status">
      <span class="sch-source-spinner" id="sourceSpinner" aria-hidden="true"></span>
      <p id="sourceMessage">Loading product lists…</p>
      <button type="button" class="btn btn-secondary" id="sourceRetry" hidden>Retry</button>
    </div>
    <div class="sch-legend" id="statusLegend" aria-label="Production status"></div>

    <header class="sch-heading">
      <label class="sch-field" for="runSuffix">Run suffix
        <input id="runSuffix" type="text" readonly tabindex="-1" inputmode="numeric" aria-readonly="true" title="Last digit of the year and the week number" />
      </label>
      <div class="sch-heading-title">
        <h1>Production Schedule</h1>
        <p>Monday 06:00 to Sunday 06:00</p>
      </div>
      <div class="sch-week" id="weekPicker">
        <button type="button" class="sch-week-nav" id="weekPrev" aria-label="Previous week">‹</button>
        <button type="button" class="sch-week-current" id="weekToggle" aria-haspopup="dialog" aria-expanded="false" aria-controls="weekPop">
          <span class="sch-week-kicker">Week commencing</span>
          <span class="sch-week-date" id="weekLabel"></span>
          <span class="sch-week-range" id="weekRange"></span>
        </button>
        <button type="button" class="sch-week-nav" id="weekNext" aria-label="Next week">›</button>
        <div class="sch-week-pop" id="weekPop" hidden role="dialog" aria-label="Choose a production week">
          <div class="sch-week-pop-bar">
            <button type="button" id="weekYearPrev" aria-label="Previous year">«</button>
            <button type="button" id="weekMonthPrev" aria-label="Previous month">‹</button>
            <strong id="weekMonthLabel"></strong>
            <button type="button" id="weekMonthNext" aria-label="Next month">›</button>
            <button type="button" id="weekYearNext" aria-label="Next year">»</button>
          </div>
          <div class="sch-week-dow" aria-hidden="true">
            <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
          </div>
          <div id="weekCal"></div>
        </div>
      </div>
    </header>

    <div class="sch-workspace">
      <div class="sch-scroll" id="scheduleScroll" aria-label="Production schedule">
        <div class="sch-grid" id="scheduleGrid"></div>
      </div>
      <aside class="sch-booking" id="bookingPanel" aria-hidden="true"></aside>
    </div>

    <section class="sch-notes" aria-label="Important notes">
      <label for="importantNotes">Important</label>
      <textarea id="importantNotes" maxlength="4000" placeholder="Notes for this production week"></textarea>
    </section>
  </div>

  <div class="sch-modal" id="blockEditor" hidden>
    <div class="sch-modal-card" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
      <h2 id="editorTitle">Production block</h2>
      <p class="sch-editor-lane" id="editorLane"></p>
      <p class="sch-form-error" id="editorError" hidden></p>
      <label class="sch-question sch-customer" for="editorCustomer">Customer
        <input id="editorCustomer" type="text" role="combobox" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search customers" aria-autocomplete="list" aria-expanded="false" aria-controls="editorCustomerList" />
        <div class="sch-customer-list" id="editorCustomerList" role="listbox" hidden></div>
      </label>
      <div class="sch-pair sch-pair-product">
        <label class="sch-question" for="editorProduct">Product
          <select id="editorProduct"></select>
        </label>
        <label class="sch-question" for="editorLiquid">Liquid Code
          <input id="editorLiquid" type="text" readonly tabindex="-1" />
        </label>
      </div>
      <div class="sch-pair sch-pair-pack">
        <label class="sch-question" for="editorFormat">Packing Format
          <select id="editorFormat"></select>
        </label>
        <div class="sch-pack-volume">
          <label class="sch-question" for="editorVolume">Volume
            <input id="editorVolume" type="number" inputmode="decimal" min="100" max="1000000" step="any" />
          </label>
          <p class="sch-volume-hint" id="editorVolumeHint">Between 100 and 1,000,000 litres.</p>
          <p class="sch-field-error" id="editorVolumeError" hidden></p>
        </div>
      </div>
      <div class="sch-times">
        <label for="editorStart">Start
          <select id="editorStart"></select>
        </label>
        <label for="editorEnd">End
          <select id="editorEnd"></select>
        </label>
      </div>
      <p class="sch-duration" id="editorDuration"></p>
      <label id="editorColourLabel">Colour</label>
      <div class="sch-swatches" id="editorSwatches" role="listbox" aria-labelledby="editorColourLabel"></div>
      <p class="sch-status" id="editorStatus" aria-live="polite"></p>
      <div class="sch-editor-actions" id="editorActions">
        <button type="button" class="btn btn-danger" id="editorDelete">Delete</button>
        <button type="button" class="btn btn-secondary" id="editorDismiss">Cancel</button>
        <button type="button" class="btn btn-success" id="editorConfirm">Add</button>
      </div>
    </div>
  </div>

  <script src="schedule-data.js"></script>
  <script src="schedule-products.js"></script>
  <script src="schedule.js"></script>
</body>
</html>
