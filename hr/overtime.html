<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overtime — SCS HR</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="hr.css" />
  <script src="../auth-session.js"></script>
  <script src="hr-guard.js"></script>
</head>
<body class="hr-theme">
  <header class="app-header">
    <div class="app-header-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark">SCS</span>
        <span class="brand-sub">Human Resources</span>
      </a>
      <div class="page-heading">
        <h1 class="page-title">Overtime</h1>
        <p class="page-sub">Record hours worked</p>
      </div>
      <nav class="header-actions">
        <a href="index.html" class="icon-btn" aria-label="HR home">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <div id="app"></div>
  </main>

  <div class="auth-overlay" id="successOverlay" hidden>
    <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="successTitle">
      <h2 id="successTitle">Hours Submitted</h2>
      <p>Thank you.<br />Your overtime has been submitted successfully and has been sent to your line manager for approval.</p>
      <button type="button" class="btn btn-primary btn-block" id="successOkBtn">OK</button>
    </div>
  </div>

  <script src="overtime.js"></script>
</body>
</html>
