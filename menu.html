<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCS App — Menu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
  <main class="menu-page fade-in">
    <header class="menu-header">
      <div class="menu-brand">
        <img
          class="auth-logo auth-logo-sm"
          src="https://drive.google.com/uc?export=view&id=1y4GWs-7VZ-13rdOLY2h6j5jbUDAJzuXe"
          alt="SCS logo"
          width="64"
          height="64"
        />
        <div>
          <h1 class="menu-title">SCS App</h1>
          <p class="menu-welcome">Welcome, <span id="welcomeUser">User</span></p>
        </div>
      </div>
      <button type="button" class="btn btn-ghost" id="logoutBtn">Log out</button>
    </header>

    <section class="module-grid" aria-label="Application modules">
      <a href="Index.html" class="module-card module-card-active">
        <span class="module-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>
        </span>
        <span class="module-name">Warehouse</span>
      </a>

      <button type="button" class="module-card" id="hrBtn">
        <span class="module-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </span>
        <span class="module-name">HR</span>
      </button>

      <button type="button" class="module-card" id="qualityBtn">
        <span class="module-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>
        </span>
        <span class="module-name">Quality</span>
      </button>
    </section>
  </main>

  <div class="auth-overlay" id="comingSoonOverlay" hidden>
    <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="comingSoonTitle">
      <h2 id="comingSoonTitle">Coming Soon</h2>
      <p>This module is not available yet.</p>
      <button type="button" class="btn btn-primary btn-block" id="closeComingSoon">OK</button>
    </div>
  </div>

  <script src="auth-session.js"></script>
  <script src="menu.js"></script>
</body>
</html>
